spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=FuncionariosDataBase;encrypt=true;trustServerCertificate=true
spring.datasource.username=${SQLSERVER_USER}
spring.datasource.password=${SQLSERVER_PASSWORD}
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
server.port=8082
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
